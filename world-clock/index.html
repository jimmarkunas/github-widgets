<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Clock + Weather</title>
<style>
  :root{
    --page:#ffffff;
    --panel:#ffffff;
    --ink:#353431;
    --muted:#6e6b67;
    --border:#b9b9b9;
    --blue:#4f9bea;
    --blue-light:#c8dcf7;
    --orange:#ff9800;
    color-scheme:light dark;
  }

  @media (prefers-color-scheme:dark){
    :root{
      --page:#191919;
      --panel:#191919;
      --ink:#f3f3f3;
      --muted:#bcb8b3;
      --border:#767676;
    }
  }

  :root[data-theme="light"]{
    --page:#ffffff;
    --panel:#ffffff;
    --ink:#353431;
    --muted:#6e6b67;
    --border:#b9b9b9;
  }

  :root[data-theme="dark"]{
    --page:#191919;
    --panel:#191919;
    --ink:#f3f3f3;
    --muted:#bcb8b3;
    --border:#767676;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--page)!important;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  }

  body{padding:18px}

  .scroll{
    width:100%;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .scroll::-webkit-scrollbar{display:none}

  .widget{
    width:100%;
    min-width:1080px;
    min-height:390px;
    padding:66px 64px 54px;
    background:var(--panel);
    border:3px dashed var(--border);
    border-radius:20px;
    color:var(--ink);
  }

  .summary{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    width:min(900px,78%);
    margin:0 auto;
  }

  .summary-copy{
    justify-self:start;
    text-align:left;
  }

  .summary-title{
    font-size:25px;
    line-height:1;
    font-weight:800;
    letter-spacing:-.02em;
  }

  .summary-subtitle{
    margin-top:8px;
    font-size:20px;
    line-height:1;
    font-weight:300;
    letter-spacing:.01em;
  }

  .summary-icon{
    justify-self:center;
    width:62px;
    height:62px;
    display:grid;
    place-items:center;
  }

  .summary-icon svg{width:62px;height:62px;display:block}

  .summary-weather{
    justify-self:end;
    min-width:190px;
    text-align:center;
  }

  .summary-temp{
    font-size:42px;
    line-height:.95;
    font-weight:400;
    letter-spacing:-.025em;
  }

  .summary-condition{
    margin-top:10px;
    font-size:22px;
    line-height:1.1;
    font-weight:400;
  }

  .cities{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:18px;
    margin-top:48px;
  }

  .city{
    min-width:0;
    text-align:center;
  }

  .city-name{
    min-height:25px;
    font-size:18px;
    line-height:1.12;
    font-weight:650;
    letter-spacing:.015em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .time{
    margin-top:8px;
    font-size:26px;
    line-height:1;
    font-weight:400;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .ampm{
    margin-left:3px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--muted);
  }

  .city-icon{
    width:50px;
    height:50px;
    margin:18px auto 10px;
    display:grid;
    place-items:center;
  }
  .city-icon svg{width:50px;height:50px;display:block}

  .temps{
    line-height:1.1;
  }

  .temp-f{
    font-size:24px;
    font-weight:650;
    white-space:nowrap;
  }

  .temp-c{
    margin-top:4px;
    font-size:19px;
    font-weight:400;
    white-space:nowrap;
  }

  .condition{
    margin-top:9px;
    min-height:18px;
    color:var(--muted);
    font-size:13px;
    line-height:1.2;
    font-weight:400;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  @media (max-width:1180px){
    body{padding:10px}
    .widget{padding-left:44px;padding-right:44px}
  }
</style>
</head>
<body>
<div class="scroll">
  <main class="widget" aria-label="World clock and weather">
    <section class="summary" aria-label="Chicago summary">
      <div class="summary-copy">
        <div class="summary-title">WORLD CLOCK</div>
        <div class="summary-subtitle">WEATHER</div>
      </div>
      <div class="summary-icon" id="summary-icon" aria-hidden="true"></div>
      <div class="summary-weather">
        <div class="summary-temp" id="summary-temp">--°F</div>
        <div class="summary-condition" id="summary-condition">Loading weather</div>
      </div>
    </section>

    <section class="cities" id="cities" aria-label="Cities"></section>
  </main>
</div>

<script>
const themeOverride = new URLSearchParams(location.search).get("theme");
if(themeOverride === "dark" || themeOverride === "light"){
  document.documentElement.dataset.theme = themeOverride;
}

const WEATHER_REFRESH_MS = 15 * 60 * 1000;
const cities = [
  {name:"Honolulu",zone:"Pacific/Honolulu",lat:21.3069,lon:-157.8583},
  {name:"Los Angeles",zone:"America/Los_Angeles",lat:34.0522,lon:-118.2437},
  {name:"Denver",zone:"America/Denver",lat:39.7392,lon:-104.9903},
  {name:"Chicago",zone:"America/Chicago",lat:41.8781,lon:-87.6298},
  {name:"New York",zone:"America/New_York",lat:40.7128,lon:-74.0060},
  {name:"London",zone:"Europe/London",lat:51.5074,lon:-0.1278},
  {name:"Paris",zone:"Europe/Paris",lat:48.8566,lon:2.3522}
];

const citiesEl = document.getElementById("cities");

function weatherLabel(code){
  if(code === 0) return "clear";
  if(code === 1) return "mostly clear";
  if(code === 2) return "partly cloudy";
  if(code === 3) return "cloudy";
  if(code === 45 || code === 48) return "fog";
  if([51,53,55,56,57].includes(code)) return "drizzle";
  if([61,63,65,66,67,80,81,82].includes(code)) return "rain";
  if([71,73,75,77,85,86].includes(code)) return "snow";
  if([95,96,99].includes(code)) return "storm";
  return "current weather";
}

function weatherIcon(code){
  const blue="var(--blue)", light="var(--blue-light)", orange="var(--orange)";

  if(code === 0){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="${orange}" stroke-width="3" stroke-linecap="round"><path d="M32 4v7M32 53v7M4 32h7M53 32h7M12 12l5 5M47 47l5 5M52 12l-5 5M17 47l-5 5"/></g><circle cx="32" cy="32" r="11" fill="${orange}"/></svg>`;
  }

  if(code === 1 || code === 2){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="${orange}" stroke-width="2.7" stroke-linecap="round"><path d="M22 5v6M6 21h6M10.5 9.5l4.5 4.5M34 9.5 29.5 14"/></g><circle cx="22" cy="21" r="9" fill="${orange}"/><path d="M19 48h28a10 10 0 0 0 0-20 14 14 0 0 0-26-3 11 11 0 0 0-2 23Z" fill="${blue}" stroke="white" stroke-width="2"/></svg>`;
  }

  if(code === 45 || code === 48){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="${blue}" stroke-width="5" stroke-linecap="round"><path d="M9 20h46M5 32h54M11 44h42"/></g></svg>`;
  }

  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 40h35a11 11 0 0 0 0-22 15 15 0 0 0-28-3 12 12 0 0 0-7 25Z" fill="${blue}"/><g stroke="#72b2f1" stroke-width="3" stroke-linecap="round"><path d="M20 47l-2 7M31 47l-2 7M42 47l-2 7"/></g></svg>`;
  }

  if([71,73,75,77,85,86].includes(code)){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 38h35a11 11 0 0 0 0-22 15 15 0 0 0-28-3 12 12 0 0 0-7 25Z" fill="${blue}"/><g fill="${light}"><circle cx="20" cy="49" r="2.5"/><circle cx="32" cy="53" r="2.5"/><circle cx="44" cy="49" r="2.5"/></g></svg>`;
  }

  if([95,96,99].includes(code)){
    return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 38h35a11 11 0 0 0 0-22 15 15 0 0 0-28-3 12 12 0 0 0-7 25Z" fill="${blue}"/><path d="M34 41l-8 12h7l-4 8 12-15h-7l4-5Z" fill="${orange}"/></svg>`;
  }

  return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 43h37a12 12 0 0 0 0-24 16 16 0 0 0-30-3 13 13 0 0 0-7 27Z" fill="${blue}"/></svg>`;
}

function build(){
  cities.forEach((city,index) => {
    const el = document.createElement("article");
    el.className = "city";
    el.innerHTML = `
      <div class="city-name">${city.name}</div>
      <div class="time"><span id="time-${index}">--:--</span><span class="ampm" id="ampm-${index}"></span></div>
      <div class="city-icon" id="icon-${index}" aria-hidden="true">${weatherIcon(2)}</div>
      <div class="temps">
        <div class="temp-f" id="temp-f-${index}">--°F</div>
        <div class="temp-c" id="temp-c-${index}">--°C</div>
      </div>
      <div class="condition" id="condition-${index}">Loading weather</div>`;
    citiesEl.appendChild(el);
  });
}

function updateTimes(){
  const now = new Date();
  cities.forEach((city,index) => {
    const parts = new Intl.DateTimeFormat("en-US",{
      timeZone:city.zone,
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    }).formatToParts(now);

    const value = type => parts.find(p => p.type === type)?.value || "";
    document.getElementById(`time-${index}`).textContent = `${value("hour")}:${value("minute")}`;
    document.getElementById(`ampm-${index}`).textContent = value("dayPeriod");
  });
}

async function fetchWeather(){
  try{
    const params = new URLSearchParams({
      latitude:cities.map(c => c.lat).join(","),
      longitude:cities.map(c => c.lon).join(","),
      current:"temperature_2m,weather_code",
      temperature_unit:"fahrenheit",
      forecast_days:"1"
    });

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),10000);
    const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`,{
      signal:controller.signal,
      cache:"no-store"
    });
    clearTimeout(timeout);

    if(!response.ok) throw new Error(`Weather request failed: ${response.status}`);

    const payload = await response.json();
    const rows = Array.isArray(payload) ? payload : [payload];
    if(rows.length !== cities.length) throw new Error("Unexpected weather response");

    rows.forEach((row,index) => {
      const tempF = row?.current?.temperature_2m;
      const code = row?.current?.weather_code;
      if(typeof tempF !== "number" || typeof code !== "number") throw new Error("Missing weather data");

      const roundedF = Math.round(tempF);
      const roundedC = Math.round((tempF - 32) * 5 / 9);
      document.getElementById(`temp-f-${index}`).textContent = `${roundedF}°F`;
      document.getElementById(`temp-c-${index}`).textContent = `${roundedC}°C`;
      document.getElementById(`condition-${index}`).textContent = weatherLabel(code);
      document.getElementById(`icon-${index}`).innerHTML = weatherIcon(code);
    });

    const chicago = rows[3];
    const chicagoF = Math.round(chicago.current.temperature_2m);
    const chicagoCode = chicago.current.weather_code;
    document.getElementById("summary-temp").textContent = `${chicagoF}°F`;
    document.getElementById("summary-condition").textContent = weatherLabel(chicagoCode);
    document.getElementById("summary-icon").innerHTML = weatherIcon(chicagoCode);
  }catch(error){
    console.error(error);
    cities.forEach((_,index) => {
      document.getElementById(`temp-f-${index}`).textContent = "--°F";
      document.getElementById(`temp-c-${index}`).textContent = "--°C";
      document.getElementById(`condition-${index}`).textContent = "Weather unavailable";
    });
    document.getElementById("summary-temp").textContent = "--°F";
    document.getElementById("summary-condition").textContent = "Weather unavailable";
    document.getElementById("summary-icon").innerHTML = weatherIcon(3);
  }
}

build();
updateTimes();
fetchWeather();
setInterval(updateTimes,1000);
setInterval(fetchWeather,WEATHER_REFRESH_MS);
</script>
</body>
</html>
