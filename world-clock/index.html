<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Clock + Weather</title>
<style>
  :root{
    --page-bg:#ffffff;
    --panel-bg:#ffffff;
    --text:#222222;
    --muted:#6f7478;
    --quiet:#9aa0a4;
    --line:#e8eaec;
    --radius:18px;
    color-scheme:light dark;
  }

  @media (prefers-color-scheme:dark){
    :root{
      --page-bg:#191919;
      --panel-bg:#222222;
      --text:#f3f3f3;
      --muted:#b7bcc0;
      --quiet:#858b90;
      --line:rgba(255,255,255,.10);
    }
  }

  :root[data-theme="light"]{
    --page-bg:#ffffff;
    --panel-bg:#ffffff;
    --text:#222222;
    --muted:#6f7478;
    --quiet:#9aa0a4;
    --line:#e8eaec;
  }

  :root[data-theme="dark"]{
    --page-bg:#191919;
    --panel-bg:#222222;
    --text:#f3f3f3;
    --muted:#b7bcc0;
    --quiet:#858b90;
    --line:rgba(255,255,255,.10);
  }

  *{box-sizing:border-box}

  html,
  body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--page-bg)!important;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Arial,sans-serif;
  }

  body{padding:6px}

  .widget-scroll{
    width:100%;
    overflow-x:auto;
    scrollbar-width:none;
  }

  .widget-scroll::-webkit-scrollbar{display:none}

  .widget{
    min-width:1015px;
    width:100%;
    height:230px;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel-bg);
  }

  .zone{
    position:relative;
    min-width:0;
    padding:18px 13px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--text);
  }

  .zone + .zone::before{
    content:"";
    position:absolute;
    left:0;
    top:18px;
    bottom:18px;
    width:1px;
    background:var(--line);
  }

  .city{
    max-width:100%;
    font-size:12px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:.065em;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .descriptor{
    margin-top:4px;
    color:var(--muted);
    font-size:9px;
    line-height:1;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
  }

  .time-row{
    margin-top:12px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:5px;
    white-space:nowrap;
  }

  .time{
    font-size:32px;
    line-height:.92;
    font-weight:430;
    letter-spacing:-.05em;
    font-variant-numeric:tabular-nums;
  }

  .ampm{
    padding-bottom:3px;
    color:var(--muted);
    font-size:9px;
    line-height:1;
    font-weight:700;
    letter-spacing:.04em;
  }

  .offset{
    margin-top:6px;
    min-height:10px;
    color:var(--quiet);
    font-size:9px;
    line-height:1;
    font-weight:560;
  }

  .weather{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:0;
  }

  .weather-main{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }

  .weather-icon{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    color:var(--text);
    flex:0 0 auto;
  }

  .weather-icon svg{
    width:33px;
    height:33px;
    display:block;
  }

  .temp-wrap{
    display:flex;
    align-items:baseline;
    gap:5px;
    white-space:nowrap;
  }

  .temp-f{
    color:var(--text);
    font-size:30px;
    line-height:.95;
    font-weight:410;
    letter-spacing:-.045em;
  }

  .temp-c{
    color:var(--muted);
    font-size:10px;
    line-height:1;
    font-weight:600;
  }

  .condition{
    max-width:100%;
    margin-top:5px;
    color:var(--text);
    font-size:11px;
    line-height:1.15;
    font-weight:440;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  @media (min-width:1250px){
    .widget{height:238px}
    .zone{padding-top:20px}
    .city{font-size:13px}
    .time{font-size:35px}
    .temp-f{font-size:32px}
    .condition{font-size:11.5px}
  }
</style>
</head>
<body>
<div class="widget-scroll">
  <div class="widget" id="worldWidget" aria-label="World clock and weather"></div>
</div>

<script>
const themeOverride = new URLSearchParams(location.search).get("theme");
if(themeOverride === "dark" || themeOverride === "light"){
  document.documentElement.dataset.theme = themeOverride;
}

const BASELINE_ZONE = "America/Chicago";
const WEATHER_REFRESH_MS = 15 * 60 * 1000;

const cities = [
  {name:"Honolulu",zone:"Pacific/Honolulu",lat:21.3069,lon:-157.8583},
  {name:"Los Angeles",zone:"America/Los_Angeles",lat:34.0522,lon:-118.2437},
  {name:"Denver",zone:"America/Denver",lat:39.7392,lon:-104.9903},
  {name:"Chicago",zone:"America/Chicago",lat:41.8781,lon:-87.6298},
  {name:"New York",zone:"America/New_York",lat:40.7128,lon:-74.0060},
  {name:"London",zone:"Europe/London",lat:51.5074,lon:-0.1278},
  {name:"Paris",zone:"Europe/Paris",lat:48.8566,lon:2.3522}
];

const widget = document.getElementById("worldWidget");

function build(){
  cities.forEach((city,index) => {
    const section = document.createElement("section");
    section.className = "zone";
    section.innerHTML = `
      <div class="city">${city.name}</div>
      <div class="descriptor">Time + Weather</div>
      <div class="time-row">
        <span class="time" id="time-${index}">--:--</span>
        <span class="ampm" id="ampm-${index}"></span>
      </div>
      <div class="offset" id="offset-${index}"></div>
      <div class="weather">
        <div class="weather-main">
          <div class="weather-icon" id="icon-${index}" aria-hidden="true">${weatherIcon(2)}</div>
          <div class="temp-wrap">
            <span class="temp-f" id="temp-f-${index}">--°F</span>
            <span class="temp-c" id="temp-c-${index}">--°C</span>
          </div>
        </div>
        <div class="condition" id="condition-${index}">Loading weather</div>
      </div>`;
    widget.appendChild(section);
  });
}

function timeParts(date,zone){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:zone,
    hour:"numeric",
    minute:"2-digit",
    hour12:true
  }).formatToParts(date);

  const part = type => parts.find(p => p.type === type)?.value || "";
  return {hour:part("hour"),minute:part("minute"),dayPeriod:part("dayPeriod")};
}

function zoneOffsetMinutes(date,zone){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:zone,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).formatToParts(date);

  const values = {};
  parts.forEach(p => {
    if(p.type !== "literal") values[p.type] = p.value;
  });

  let hour = Number(values.hour);
  if(hour === 24) hour = 0;

  const representedAsUtc = Date.UTC(
    Number(values.year),
    Number(values.month)-1,
    Number(values.day),
    hour,
    Number(values.minute),
    Number(values.second)
  );

  return Math.round((representedAsUtc - date.getTime()) / 60000);
}

function relativeOffset(date,zone){
  const delta = zoneOffsetMinutes(date,zone) - zoneOffsetMinutes(date,BASELINE_ZONE);
  if(delta === 0) return "Chicago time";

  const sign = delta > 0 ? "+" : "−";
  const absolute = Math.abs(delta);
  const hours = Math.floor(absolute / 60);
  const minutes = absolute % 60;
  const amount = minutes ? `${hours}:${String(minutes).padStart(2,"0")}` : `${hours}`;
  return `${sign}${amount} hr vs Chicago`;
}

function updateTimes(){
  const now = new Date();
  cities.forEach((city,index) => {
    const parts = timeParts(now,city.zone);
    document.getElementById(`time-${index}`).textContent = `${parts.hour}:${parts.minute}`;
    document.getElementById(`ampm-${index}`).textContent = parts.dayPeriod;
    document.getElementById(`offset-${index}`).textContent = relativeOffset(now,city.zone);
  });
}

function weatherLabel(code){
  if(code === 0) return "Clear";
  if(code === 1) return "Mostly clear";
  if(code === 2) return "Partly cloudy";
  if(code === 3) return "Cloudy";
  if(code === 45 || code === 48) return "Fog";
  if([51,53,55,56,57].includes(code)) return "Drizzle";
  if([61,63,65,66,67,80,81,82].includes(code)) return "Rain";
  if([71,73,75,77,85,86].includes(code)) return "Snow";
  if([95,96,99].includes(code)) return "Storm";
  return "Current weather";
}

function weatherIcon(code){
  const common = `fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 40 40"`;

  if(code === 0){
    return `<svg ${common}><circle cx="20" cy="20" r="6"/><path d="M20 5v4M20 31v4M5 20h4M31 20h4M9.4 9.4l2.8 2.8M27.8 27.8l2.8 2.8M30.6 9.4l-2.8 2.8M12.2 27.8l-2.8 2.8"/></svg>`;
  }
  if(code === 45 || code === 48){
    return `<svg ${common}><path d="M8 14h24M5 20h30M9 26h22"/></svg>`;
  }
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)){
    return `<svg ${common}><path d="M11 25h17a6 6 0 0 0 .5-12 9 9 0 0 0-17.2 2.3A5 5 0 0 0 11 25Z"/><path d="M14 29l-2 4M21 29l-2 4M28 29l-2 4"/></svg>`;
  }
  if([71,73,75,77,85,86].includes(code)){
    return `<svg ${common}><path d="M11 24h17a6 6 0 0 0 .5-12 9 9 0 0 0-17.2 2.3A5 5 0 0 0 11 24Z"/><path d="M13 30h.01M20 30h.01M27 30h.01M16.5 34h.01M23.5 34h.01" stroke-width="3"/></svg>`;
  }
  if([95,96,99].includes(code)){
    return `<svg ${common}><path d="M11 24h17a6 6 0 0 0 .5-12 9 9 0 0 0-17.2 2.3A5 5 0 0 0 11 24Z"/><path d="M21 27l-4 6h4l-2 4 6-8h-4l2-2"/></svg>`;
  }
  if(code === 1 || code === 2){
    return `<svg ${common}><circle cx="14" cy="14" r="5"/><path d="M14 5v3M5 14h3M7.5 7.5l2.1 2.1M11 27h17a6 6 0 0 0 .5-12 9 9 0 0 0-17.2 2.3A5 5 0 0 0 11 27Z"/></svg>`;
  }
  return `<svg ${common}><path d="M10 27h18a6.5 6.5 0 0 0 .5-13 9.5 9.5 0 0 0-18 2.5A5.5 5.5 0 0 0 10 27Z"/></svg>`;
}

async function fetchWeather(){
  try{
    const params = new URLSearchParams({
      latitude:cities.map(c => c.lat).join(","),
      longitude:cities.map(c => c.lon).join(","),
      current:"temperature_2m,weather_code",
      temperature_unit:"fahrenheit",
      forecast_days:"1"
    });

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),10000);
    const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`,{
      signal:controller.signal,
      cache:"no-store"
    });
    clearTimeout(timeout);

    if(!response.ok) throw new Error(`Weather request failed: ${response.status}`);

    const payload = await response.json();
    const rows = Array.isArray(payload) ? payload : [payload];
    if(rows.length !== cities.length) throw new Error("Unexpected weather response");

    rows.forEach((row,index) => {
      const tempF = row?.current?.temperature_2m;
      const code = row?.current?.weather_code;
      if(typeof tempF !== "number" || typeof code !== "number"){
        throw new Error(`Missing weather data for ${cities[index].name}`);
      }

      const roundedF = Math.round(tempF);
      const roundedC = Math.round((tempF - 32) * 5 / 9);
      document.getElementById(`temp-f-${index}`).textContent = `${roundedF}°F`;
      document.getElementById(`temp-c-${index}`).textContent = `${roundedC}°C`;
      document.getElementById(`condition-${index}`).textContent = weatherLabel(code);
      document.getElementById(`icon-${index}`).innerHTML = weatherIcon(code);
    });
  }catch(error){
    console.error(error);
    cities.forEach((_,index) => {
      document.getElementById(`temp-f-${index}`).textContent = "--°F";
      document.getElementById(`temp-c-${index}`).textContent = "--°C";
      document.getElementById(`condition-${index}`).textContent = "Weather unavailable";
    });
  }
}

build();
updateTimes();
fetchWeather();
setInterval(updateTimes,1000);
setInterval(fetchWeather,WEATHER_REFRESH_MS);
</script>
</body>
</html>
