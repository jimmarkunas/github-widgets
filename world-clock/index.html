<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Clock</title>
<style>
  :root{
    --ink:#222222;
    --text:#f3f3f3;
    --muted:#aeb5ba;
    --subtle:#7f878d;
    --gap:10px;
    --radius:16px;
  }

  *{box-sizing:border-box}

  html,
  body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:rgba(0,0,0,0) !important;
    background-color:transparent !important;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Arial,sans-serif;
  }

  body{padding:6px}

  .clock-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(126px,1fr));
    gap:var(--gap);
    width:100%;
    background:transparent !important;
    overflow-x:auto;
    scrollbar-width:none;
  }

  .clock-grid::-webkit-scrollbar{display:none}

  .clock{
    height:132px;
    min-width:126px;
    border-radius:var(--radius);
    background:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12px 8px 10px;
    overflow:hidden;
  }

  .city{
    width:100%;
    margin-bottom:8px;
    text-align:center;
    font-size:13px;
    line-height:1.1;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .time-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:5px;
    width:100%;
    white-space:nowrap;
  }

  .time{
    font-size:34px;
    line-height:.95;
    font-weight:760;
    letter-spacing:-.055em;
    font-variant-numeric:tabular-nums;
    color:var(--text);
  }

  .ampm{
    font-size:10px;
    font-weight:750;
    letter-spacing:.04em;
    color:var(--muted);
  }

  .weather{
    margin-top:10px;
    max-width:100%;
    min-height:16px;
    color:var(--muted);
    font-size:11px;
    line-height:1;
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .offset{
    margin-top:7px;
    min-height:12px;
    color:var(--subtle);
    font-size:10px;
    line-height:1;
    font-weight:650;
  }

  @media (min-width:1180px){
    .clock{height:138px}
    .city{font-size:14px}
    .time{font-size:38px}
    .weather{font-size:12px}
  }
</style>
</head>
<body>
<div class="clock-grid" id="clockGrid" aria-label="World clocks"></div>

<script>
const BASELINE_ZONE = "America/Chicago";
const WEATHER_REFRESH_MS = 15 * 60 * 1000;

const clocks = [
  { name:"Honolulu",    zone:"Pacific/Honolulu",    lat:21.3069, lon:-157.8583 },
  { name:"Los Angeles", zone:"America/Los_Angeles", lat:34.0522, lon:-118.2437 },
  { name:"Denver",      zone:"America/Denver",      lat:39.7392, lon:-104.9903 },
  { name:"Chicago",     zone:"America/Chicago",     lat:41.8781, lon:-87.6298 },
  { name:"New York",    zone:"America/New_York",    lat:40.7128, lon:-74.0060 },
  { name:"London",      zone:"Europe/London",       lat:51.5074, lon:-0.1278 },
  { name:"Paris",       zone:"Europe/Paris",        lat:48.8566, lon:2.3522 }
];

const grid = document.getElementById("clockGrid");

function build(){
  clocks.forEach((clock,index) => {
    const card = document.createElement("section");
    card.className = "clock";
    card.innerHTML = `
      <div class="city">${clock.name}</div>
      <div class="time-row">
        <span class="time" id="time-${index}">--:--</span>
        <span class="ampm" id="ampm-${index}"></span>
      </div>
      <div class="weather" id="weather-${index}">Loading weather</div>
      <div class="offset" id="offset-${index}"></div>`;
    grid.appendChild(card);
  });
}

function timeParts(date,zone){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:zone,
    hour:"numeric",
    minute:"2-digit",
    hour12:true
  }).formatToParts(date);

  const part = type => parts.find(p => p.type === type)?.value || "";
  return {
    hour:part("hour"),
    minute:part("minute"),
    dayPeriod:part("dayPeriod")
  };
}

function zoneOffsetMinutes(date,zone){
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:zone,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).formatToParts(date);

  const values = {};
  parts.forEach(p => {
    if(p.type !== "literal") values[p.type] = p.value;
  });

  let hour = Number(values.hour);
  if(hour === 24) hour = 0;

  const representedAsUtc = Date.UTC(
    Number(values.year),
    Number(values.month)-1,
    Number(values.day),
    hour,
    Number(values.minute),
    Number(values.second)
  );

  return Math.round((representedAsUtc - date.getTime()) / 60000);
}

function relativeOffset(date,zone){
  const delta = zoneOffsetMinutes(date,zone) - zoneOffsetMinutes(date,BASELINE_ZONE);
  if(delta === 0) return "";

  const sign = delta > 0 ? "+" : "−";
  const absolute = Math.abs(delta);
  const hours = Math.floor(absolute / 60);
  const minutes = absolute % 60;

  return minutes
    ? `${sign}${hours}:${String(minutes).padStart(2,"0")} hr`
    : `${sign}${hours} hr`;
}

function updateTimes(){
  const now = new Date();

  clocks.forEach((clock,index) => {
    const parts = timeParts(now,clock.zone);
    document.getElementById(`time-${index}`).textContent = `${parts.hour}:${parts.minute}`;
    document.getElementById(`ampm-${index}`).textContent = parts.dayPeriod;
    document.getElementById(`offset-${index}`).textContent = relativeOffset(now,clock.zone);
  });
}

function weatherLabel(code){
  if(code === 0) return "Clear";
  if(code === 1) return "Mostly clear";
  if(code === 2) return "Partly cloudy";
  if(code === 3) return "Cloudy";
  if(code === 45 || code === 48) return "Fog";
  if([51,53,55,56,57].includes(code)) return "Drizzle";
  if([61,63,65,66,67,80,81,82].includes(code)) return "Rain";
  if([71,73,75,77,85,86].includes(code)) return "Snow";
  if([95,96,99].includes(code)) return "Storm";
  return "Current weather";
}

async function fetchWeather(){
  const weatherEls = clocks.map((_,i) => document.getElementById(`weather-${i}`));

  try{
    const params = new URLSearchParams({
      latitude:clocks.map(c => c.lat).join(","),
      longitude:clocks.map(c => c.lon).join(","),
      current:"temperature_2m,weather_code",
      temperature_unit:"fahrenheit",
      forecast_days:"1"
    });

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),10000);

    const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`,{
      signal:controller.signal,
      cache:"no-store"
    });
    clearTimeout(timeout);

    if(!response.ok) throw new Error(`Weather request failed: ${response.status}`);

    const payload = await response.json();
    const rows = Array.isArray(payload) ? payload : [payload];

    if(rows.length !== clocks.length) throw new Error("Unexpected weather response");

    rows.forEach((row,index) => {
      const tempF = row?.current?.temperature_2m;
      const code = row?.current?.weather_code;

      if(typeof tempF !== "number" || typeof code !== "number") {
        throw new Error(`Missing weather data for ${clocks[index].name}`);
      }

      const roundedF = Math.round(tempF);
      const roundedC = Math.round((tempF - 32) * 5 / 9);
      weatherEls[index].textContent = `${roundedF}°F · ${roundedC}°C  ${weatherLabel(code)}`;
    });
  }catch(error){
    console.error(error);
    weatherEls.forEach(el => {
      el.textContent = "Weather unavailable";
    });
  }
}

build();
updateTimes();
fetchWeather();
setInterval(updateTimes,1000);
setInterval(fetchWeather,WEATHER_REFRESH_MS);
</script>
</body>
</html>
