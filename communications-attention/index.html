<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>LIFE OS — Communications Mac app text links</title>
  <style>
    :root{color-scheme:light dark;--fg:#25272b;--link:#2966b5}
    @media(prefers-color-scheme:dark){:root{--fg:#ededf0;--link:#88b8ff}}
    *{box-sizing:border-box}
    html,body{margin:0;max-width:100%;background:transparent;color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{margin:0;padding:0 2px}
    nav{display:flex;flex-direction:column;align-items:stretch}
    a{display:flex;align-items:center;gap:9px;min-height:43px;padding:2px 0;border:0;border-radius:0;background:transparent;color:var(--fg);font:inherit;font-weight:400;text-decoration:none;text-align:left;white-space:nowrap}
    a:hover{text-decoration:underline;color:var(--link)}
    a:focus-visible{outline:2px solid var(--link);outline-offset:1px}
    .emoji{display:inline-block;width:24px;flex:0 0 24px;text-align:center;font-size:18px}
  </style>
</head>
<body>
  <!-- Public link text ONLY. Never put private counts, latest contacts, identifiers, credentials, or state here. -->
  <main>
    <nav aria-label="Open installed Mac communications apps">
      <a href="messages://" target="_blank" rel="noopener noreferrer" aria-label="Open Messages Mac app"><span class="emoji" aria-hidden="true">💬</span>Messages (—)</a>
      <a href="tg://" target="_blank" rel="noopener noreferrer" aria-label="Open Telegram Mac app"><span class="emoji" aria-hidden="true">✈️</span>Telegram (—)</a>
      <a href="whatsapp://" target="_blank" rel="noopener noreferrer" aria-label="Open WhatsApp Mac app"><span class="emoji" aria-hidden="true">🟢</span>WhatsApp (—)</a>
      <a href="discord://" target="_blank" rel="noopener noreferrer" aria-label="Open Discord Mac app"><span class="emoji" aria-hidden="true">🎮</span>Discord</a>
    </nav>
  </main>
</body>
</html>
