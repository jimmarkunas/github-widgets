<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>LIFE OS — Open Mac Communications Apps</title>
  <style>
    :root{color-scheme:light dark;--fg:#24262b;--muted:#686e78;--line:#dfe2e7;--surface:#f7f8fa;--focus:#2966b5}
    @media(prefers-color-scheme:dark){:root{--fg:#f1f1f3;--muted:#afb4bc;--line:#3c414b;--surface:#25282e;--focus:#9dc7ff}}
    *{box-sizing:border-box}
    html,body{margin:0;background:transparent;color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{padding:5px 7px 3px}
    nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 6px;color:var(--fg);text-decoration:none;font-weight:600;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
    a:hover{text-decoration:underline;filter:brightness(.96)}
    a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .emoji{font-size:18px;line-height:1}
    small{display:block;margin-top:4px;color:var(--muted);font-size:11px}
    @media(max-width:420px){nav{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <!-- Public, link-only launcher. Never put private message counts, contacts, identifiers, tokens, or state in this file. -->
  <main>
    <nav aria-label="Open installed communications apps on your Mac">
      <a href="messages://" target="_blank" rel="noopener noreferrer" aria-label="Open Messages Mac app"><span class="emoji" aria-hidden="true">💬</span>Messages</a>
      <a href="tg://" target="_blank" rel="noopener noreferrer" aria-label="Open Telegram Mac app"><span class="emoji" aria-hidden="true">✈️</span>Telegram</a>
      <a href="whatsapp://" target="_blank" rel="noopener noreferrer" aria-label="Open WhatsApp Mac app"><span class="emoji" aria-hidden="true">🟢</span>WhatsApp</a>
      <a href="discord://" target="_blank" rel="noopener noreferrer" aria-label="Open Discord Mac app"><span class="emoji" aria-hidden="true">🎮</span>Discord</a>
    </nav>
    <small>Open Mac apps · Your browser may ask permission</small>
  </main>
</body>
</html>
